[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "indy-geospatial-accessibility-platform"
version = "0.1.0"
description = "API and GIS processing foundation for Marion County accessibility analysis"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Ahmed Balde" }]
dependencies = [
  "fastapi>=0.116,<1.0",
  "openpyxl>=3.1,<4.0",
  "psycopg[binary]>=3.2,<4.0",
  "pyproj>=3.7,<4.0",
  "shapely>=2.0,<3.0",
  "uvicorn[standard]>=0.35,<1.0",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1.0",
  "mypy>=1.17,<2.0",
  "pytest>=8.4,<9.0",
  "pytest-cov>=6.2,<7.0",
  "ruff>=0.12,<1.0",
  "types-openpyxl>=3.1,<4.0",
  "types-shapely>=2.0,<3.0",
]

[tool.setuptools.packages.find]
where = ["backend/src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=indy_accessibility_api --cov=indy_accessibility_data --cov-report=term-missing --cov-fail-under=90"
testpaths = ["backend/tests"]
markers = [
  "integration: tests requiring a configured PostgreSQL/PostGIS database",
]

[tool.coverage.run]
branch = true
omit = ["backend/src/indy_accessibility_data/__main__.py"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["backend/src", "backend/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.11"
strict = true
files = ["backend/src", "backend/tests"]
